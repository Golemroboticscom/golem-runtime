[project]
name = "golem-runtime"
version = "0.1.0"
description = "Golem Runtime - the lean rebuild: LangGraph flow engine driven by tables, gated in Telegram"
requires-python = ">=3.10"
dependencies = [
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
